[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splatagent-pipeline"
version = "0.1.0"
description = "Generate 3D Gaussian Splats from images or video"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "gsplat>=1.0.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    "torchmetrics>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
splatagent-pipeline = "splatagent_pipeline.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
