<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 496" xmlns="http://www.w3.org/2000/svg">
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5d5d5d"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b87c7"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf9f7"/>

      <!-- Arrows -->
      <line x1="232" y1="168" x2="280" y2="168" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="472" y1="168" x2="520" y2="168" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="712" y1="168" x2="760" y2="168" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Incremental loop, above the row -->
      <path d="M 856,136 V 104 Q 856,96 848,96 H 384 Q 376,96 376,104 V 136"
            fill="none" stroke="#5d5d5d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Result -->
      <path d="M 856,200 V 296 Q 856,304 848,304 H 808"
            fill="none" stroke="#5b87c7" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <rect x="536" y="76" width="152" height="12" rx="2" fill="#faf9f7"/>
      <text x="612" y="85" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">THEN THE NEXT PHOTO</text>

      <rect x="864" y="240" width="88" height="12" rx="2" fill="#faf9f7"/>
      <text x="872" y="249" fill="#5b87c7" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">WHEN DONE</text>

      <!-- Node 1: features -->
      <rect x="40" y="136" width="192" height="64" rx="6" fill="#faf9f7"/>
      <rect x="40" y="136" width="192" height="64" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <rect x="48" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,30,30,0.40)" stroke-width="0.8"/>
      <text x="62" y="153" fill="#1e1e1e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
      <text x="136" y="172" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Find landmarks</text>
      <text x="136" y="188" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">40k corners per frame</text>

      <!-- Node 2: match -->
      <rect x="280" y="136" width="192" height="64" rx="6" fill="#faf9f7"/>
      <rect x="280" y="136" width="192" height="64" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <rect x="288" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,30,30,0.40)" stroke-width="0.8"/>
      <text x="302" y="153" fill="#1e1e1e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
      <text x="376" y="172" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Match them across frames</text>
      <text x="376" y="188" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">same corner, new angle</text>

      <!-- Node 3: triangulate -->
      <rect x="520" y="136" width="192" height="64" rx="6" fill="#faf9f7"/>
      <rect x="520" y="136" width="192" height="64" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <rect x="528" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,30,30,0.40)" stroke-width="0.8"/>
      <text x="542" y="153" fill="#1e1e1e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
      <text x="616" y="172" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Triangulate</text>
      <text x="616" y="188" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">two angles → depth</text>

      <!-- Node 4: bundle adjust -->
      <rect x="760" y="136" width="192" height="64" rx="6" fill="#faf9f7"/>
      <rect x="760" y="136" width="192" height="64" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <rect x="768" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,30,30,0.40)" stroke-width="0.8"/>
      <text x="782" y="153" fill="#1e1e1e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
      <text x="856" y="172" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Re-solve everything</text>
      <text x="856" y="188" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bundle adjustment</text>

      <!-- Result node (focal) -->
      <rect x="528" y="272" width="280" height="64" rx="6" fill="#faf9f7"/>
      <rect x="528" y="272" width="280" height="64" rx="6" fill="rgba(91,135,199,0.10)" stroke="#5b87c7" stroke-width="1"/>
      <rect x="536" y="280" width="44" height="12" rx="2" fill="transparent" stroke="rgba(91,135,199,0.50)" stroke-width="0.8"/>
      <text x="558" y="289" fill="#5b87c7" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUTPUT</text>
      <text x="668" y="308" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A pose for every photo + sparse points</text>
      <text x="668" y="324" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">705 / 705 frames registered · 604k points</text>

      <!-- Editorial callouts -->
      <text x="40" y="296" fill="#1e1e1e" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">The same corner, seen</text>
      <text x="40" y="316" fill="#1e1e1e" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">from two places, gives</text>
      <text x="40" y="336" fill="#1e1e1e" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">depth — like two eyes.</text>
      <path d="M 224 288 Q 400 264 604 208" fill="none" stroke="rgba(30,30,30,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="606" cy="206" r="2" fill="#1e1e1e"/>

      <text x="40" y="392" fill="#5d5d5d" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">If these poses are wrong, nothing downstream can fix it.</text>

      <!-- Legend -->
      <line x1="40" y1="416" x2="960" y2="416" stroke="rgba(30,30,30,0.10)" stroke-width="0.8"/>
      <text x="40" y="432" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="448" width="14" height="10" rx="2" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <text x="60" y="456" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

      <rect x="152" y="448" width="14" height="10" rx="2" fill="rgba(91,135,199,0.10)" stroke="#5b87c7" stroke-width="1"/>
      <text x="172" y="456" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Focal · the skeleton everything else hangs on</text>

      <line x1="484" y1="454" x2="512" y2="454" stroke="#5d5d5d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="520" y="456" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Incremental — one photo at a time</text>
    </svg>
