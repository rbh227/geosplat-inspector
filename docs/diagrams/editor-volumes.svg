<svg width="1000" height="632" viewBox="0 0 1000 632" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5d5d5d"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf9f7"/>

      <!-- Arrows first -->
      <line x1="420" y1="112" x2="420" y2="152" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="216" x2="420" y2="256" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="320" x2="420" y2="352" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="484" y1="392" x2="616" y2="392" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 712,360 V 216 Q 712,208 704,208 H 528"
            fill="none" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="432" x2="420" y2="472" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="534" y="372" width="32" height="12" rx="2" fill="#faf9f7"/>
      <text x="550" y="381" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <rect x="588" y="188" width="56" height="12" rx="2" fill="#faf9f7"/>
      <text x="616" y="197" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESIZE</text>

      <rect x="428" y="440" width="36" height="12" rx="2" fill="#faf9f7"/>
      <text x="446" y="449" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">YES</text>

      <!-- Start oval -->
      <rect x="320" y="64" width="200" height="48" rx="20" fill="#faf9f7"/>
      <rect x="320" y="64" width="200" height="48" rx="20" fill="rgba(93,93,93,0.10)" stroke="#7e7e7e" stroke-width="1"/>
      <text x="420" y="93" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Place a sphere or box</text>

      <!-- Step: SDF -->
      <rect x="320" y="152" width="200" height="64" rx="6" fill="#faf9f7"/>
      <rect x="320" y="152" width="200" height="64" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <rect x="328" y="160" width="32" height="12" rx="2" fill="transparent" stroke="rgba(30,30,30,0.40)" stroke-width="0.8"/>
      <text x="344" y="169" fill="#1e1e1e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SDF</text>
      <text x="420" y="188" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Signed distance per splat</text>
      <text x="420" y="204" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">inside · outside</text>

      <!-- Step: preview (focal) -->
      <rect x="320" y="256" width="200" height="64" rx="6" fill="#faf9f7"/>
      <rect x="320" y="256" width="200" height="64" rx="6" fill="rgba(91,135,199,0.10)" stroke="#5b87c7" stroke-width="1"/>
      <rect x="328" y="264" width="44" height="12" rx="2" fill="transparent" stroke="rgba(91,135,199,0.50)" stroke-width="0.8"/>
      <text x="350" y="273" fill="#5b87c7" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIVE</text>
      <text x="420" y="292" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Everything outside dims</text>
      <text x="420" y="308" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">preview only · nothing cut</text>

      <!-- Decision -->
      <polygon points="420,352 484,392 420,432 356,392" fill="#faf9f7"/>
      <polygon points="420,352 484,392 420,432 356,392" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <text x="420" y="396" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Right shape?</text>

      <!-- Step: adjust -->
      <rect x="616" y="360" width="192" height="64" rx="6" fill="#faf9f7"/>
      <rect x="616" y="360" width="192" height="64" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <rect x="624" y="368" width="44" height="12" rx="2" fill="transparent" stroke="rgba(30,30,30,0.40)" stroke-width="0.8"/>
      <text x="646" y="377" fill="#1e1e1e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DRAG</text>
      <text x="712" y="396" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Move or resize it</text>
      <text x="712" y="412" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">preview follows</text>

      <!-- End oval -->
      <rect x="320" y="472" width="200" height="48" rx="20" fill="#faf9f7"/>
      <rect x="320" y="472" width="200" height="48" rx="20" fill="rgba(30,30,30,0.05)" stroke="#5d5d5d" stroke-width="1"/>
      <text x="420" y="501" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Keep inside · delete inside</text>

      <!-- Editorial callout -->
      <text x="40" y="404" fill="#5b87c7" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">The agent places the same volumes —</text>
      <text x="40" y="424" fill="#5b87c7" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">its selection dims before anything is cut</text>
      <path d="M 216 392 Q 268 376 312 300" fill="none" stroke="rgba(91,135,199,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="316" cy="296" r="2" fill="#5b87c7"/>

      <!-- Legend -->
      <line x1="40" y1="560" x2="960" y2="560" stroke="rgba(30,30,30,0.10)" stroke-width="0.8"/>
      <text x="40" y="576" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="592" width="14" height="10" rx="5" fill="rgba(93,93,93,0.10)" stroke="#7e7e7e" stroke-width="1"/>
      <text x="60" y="600" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>

      <rect x="168" y="592" width="14" height="10" rx="2" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <text x="188" y="600" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

      <polygon points="272,592 282,597 272,602 262,597" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <text x="292" y="600" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

      <rect x="392" y="592" width="14" height="10" rx="2" fill="rgba(91,135,199,0.10)" stroke="#5b87c7" stroke-width="1"/>
      <text x="412" y="600" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Focal · non-destructive preview</text>
    </svg>
