<svg width="1000" height="480" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5d5d5d"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b87c7"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf9f7"/>

      <!-- Transitions first -->
      <line x1="88" y1="236" x2="128" y2="236" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="304" y1="216" x2="412" y2="216" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="412" y1="256" x2="304" y2="256" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="588" y1="216" x2="696" y2="216" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="696" y1="256" x2="588" y2="256" stroke="#5b87c7" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Self-loops -->
      <path d="M 172,200 C 172,156 252,156 252,196" fill="none" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 456,200 C 456,156 536,156 536,196" fill="none" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Transition labels -->
      <rect x="316" y="196" width="84" height="12" rx="2" fill="#faf9f7"/>
      <text x="358" y="205" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOGGLE · FLY</text>

      <rect x="308" y="264" width="100" height="12" rx="2" fill="#faf9f7"/>
      <text x="358" y="273" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOGGLE · ORBIT</text>

      <rect x="600" y="196" width="84" height="12" rx="2" fill="#faf9f7"/>
      <text x="642" y="205" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT RUN</text>

      <rect x="592" y="264" width="100" height="12" rx="2" fill="#faf9f7"/>
      <text x="642" y="273" fill="#5b87c7" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YOU TOUCH IT</text>

      <rect x="156" y="132" width="112" height="12" rx="2" fill="#faf9f7"/>
      <text x="212" y="141" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DRAG · ORBIT TARGET</text>

      <rect x="436" y="132" width="120" height="12" rx="2" fill="#faf9f7"/>
      <text x="496" y="141" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WASD · QE · LOOK</text>

      <!-- Start marker -->
      <circle cx="80" cy="236" r="6" fill="#1e1e1e"/>

      <!-- State: Orbit -->
      <rect x="128" y="200" width="176" height="72" rx="8" fill="#faf9f7"/>
      <rect x="128" y="200" width="176" height="72" rx="8" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <rect x="136" y="208" width="44" height="12" rx="2" fill="transparent" stroke="rgba(30,30,30,0.40)" stroke-width="0.8"/>
      <text x="158" y="217" fill="#1e1e1e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEFAULT</text>
      <text x="216" y="240" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Orbit</text>
      <text x="216" y="256" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">circle the scene</text>

      <!-- State: Fly -->
      <rect x="412" y="200" width="176" height="72" rx="8" fill="#faf9f7"/>
      <rect x="412" y="200" width="176" height="72" rx="8" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <rect x="420" y="208" width="40" height="12" rx="2" fill="transparent" stroke="rgba(30,30,30,0.40)" stroke-width="0.8"/>
      <text x="440" y="217" fill="#1e1e1e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MANUAL</text>
      <text x="500" y="240" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fly</text>
      <text x="500" y="256" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">get inside the scene</text>

      <!-- State: Agent-driven (focal) -->
      <rect x="696" y="200" width="176" height="72" rx="8" fill="#faf9f7"/>
      <rect x="696" y="200" width="176" height="72" rx="8" fill="rgba(91,135,199,0.10)" stroke="#5b87c7" stroke-width="1"/>
      <rect x="704" y="208" width="40" height="12" rx="2" fill="transparent" stroke="rgba(91,135,199,0.50)" stroke-width="0.8"/>
      <text x="724" y="217" fill="#5b87c7" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="784" y="240" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent-driven</text>
      <text x="784" y="256" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">move_camera · paced</text>

      <!-- Editorial callout -->
      <text x="40" y="344" fill="#1e1e1e" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">The movement pad lights up for</text>
      <text x="40" y="364" fill="#1e1e1e" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">any input source — that is how</text>
      <text x="40" y="384" fill="#1e1e1e" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">you watch the agent fly</text>
      <path d="M 292 356 Q 500 340 700 278" fill="none" stroke="rgba(30,30,30,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="702" cy="274" r="2" fill="#1e1e1e"/>

      <!-- Legend -->
      <line x1="40" y1="408" x2="960" y2="408" stroke="rgba(30,30,30,0.10)" stroke-width="0.8"/>
      <text x="40" y="424" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <circle cx="47" cy="445" r="5" fill="#1e1e1e"/>
      <text x="60" y="448" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Start</text>

      <rect x="140" y="440" width="14" height="10" rx="4" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <text x="160" y="448" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Human-driven state</text>

      <rect x="320" y="440" width="14" height="10" rx="4" fill="rgba(91,135,199,0.10)" stroke="#5b87c7" stroke-width="1"/>
      <text x="340" y="448" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Focal · agent holds the camera</text>

      <line x1="576" y1="446" x2="604" y2="446" stroke="#5b87c7" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="612" y="448" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Manual input pauses the run at the next tool boundary</text>
    </svg>
