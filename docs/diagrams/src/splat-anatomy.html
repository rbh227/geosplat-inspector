<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplatAgent · A scene made of soft coloured blobs</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #151515; --panel: #1e1e1e; --ink: #d6d6d6;
      --muted: #a9a9a9; --dim: #7e7e7e; --accent: #5b87c7;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.6rem, 2.4vw + 0.8rem, 2.2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.75rem;
    }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">What a splat is</p>
    <h1>A scene made of soft coloured blobs</h1>

    <svg viewBox="0 0 960 504" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7e7e7e"/></marker>
        <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#5b87c7"/></marker>
        <radialGradient id="blob" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#7ba3dd" stop-opacity="0.85"/>
          <stop offset="55%" stop-color="#5b87c7" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#5b87c7" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <rect width="100%" height="100%" fill="#151515"/>

      <rect x="48" y="48" width="864" height="352" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <ellipse cx="272" cy="224" rx="144" ry="92" transform="rotate(-18 272 224)" fill="url(#blob)"/>
      <ellipse cx="272" cy="224" rx="144" ry="92" transform="rotate(-18 272 224)" fill="none" stroke="#5b87c7" stroke-width="1.5" stroke-dasharray="6,5"/>
      <circle cx="272" cy="224" r="4" fill="#7ba3dd"/>
      <text x="520" y="104" fill="#7e7e7e" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ONE GAUSSIAN CARRIES</text>
      <text x="520" y="156" fill="#d6d6d6" font-size="20" font-weight="600" font-family="'Geist', sans-serif">Position</text>
      <text x="520" y="180" fill="#a9a9a9" font-size="13" font-family="'Geist Mono', monospace">where it sits</text>
      <text x="520" y="212" fill="#d6d6d6" font-size="20" font-weight="600" font-family="'Geist', sans-serif">Size and tilt</text>
      <text x="520" y="236" fill="#a9a9a9" font-size="13" font-family="'Geist Mono', monospace">how it stretches</text>
      <text x="520" y="268" fill="#d6d6d6" font-size="20" font-weight="600" font-family="'Geist', sans-serif">Opacity</text>
      <text x="520" y="292" fill="#a9a9a9" font-size="13" font-family="'Geist Mono', monospace">see-through → solid</text>
      <text x="520" y="324" fill="#d6d6d6" font-size="20" font-weight="600" font-family="'Geist', sans-serif">Colour</text>
      <text x="520" y="348" fill="#a9a9a9" font-size="13" font-family="'Geist Mono', monospace">changes with your angle</text>
      <text x="48" y="456" fill="#a9a9a9" font-size="17" font-style="italic" font-family="'Instrument Serif', serif">That is the whole model: about 59 numbers.</text>
      <text x="48" y="480" fill="#a9a9a9" font-size="17" font-style="italic" font-family="'Instrument Serif', serif">A million of them, fitted to photographs, are a place.</text>
    </svg>
  </div>
</body>
</html>
