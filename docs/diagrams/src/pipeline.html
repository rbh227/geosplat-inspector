<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplatAgent · Drone video to a 2.9 MB building</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #151515; --panel: #1e1e1e; --ink: #d6d6d6;
      --muted: #a9a9a9; --dim: #7e7e7e; --accent: #5b87c7;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.6rem, 2.4vw + 0.8rem, 2.2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.75rem;
    }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Pipeline</p>
    <h1>Drone video to a 2.9 MB building</h1>

    <svg viewBox="0 0 1000 372" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7e7e7e"/></marker>
        <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#5b87c7"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#151515"/>

      <!-- bypass -->
      <path d="M 128,136 V 96 Q 128,88 136,88 H 616 Q 624,88 624,96 V 136" fill="none" stroke="#7e7e7e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="232" y1="184" x2="272" y2="184" stroke="#7e7e7e" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="480" y1="184" x2="520" y2="184" stroke="#7e7e7e" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="728" y1="184" x2="768" y2="184" stroke="#5b87c7" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <rect x="244" y="56" width="264" height="16" rx="2" fill="#151515"/>
      <text x="376" y="68" fill="#7e7e7e" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">VGGT — ONE FORWARD PASS INSTEAD</text>
      <rect x="24" y="136" width="208" height="96" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="128" y="180" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Drone video</text>
      <text x="128" y="204" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">3,525 frames</text>
      <rect x="272" y="136" width="208" height="96" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="376" y="180" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">COLMAP</text>
      <text x="376" y="204" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">705 poses · 604k pts</text>
      <rect x="520" y="136" width="208" height="96" rx="4" fill="rgba(91,135,199,0.15)" stroke="#5b87c7" stroke-width="1.5"/>
      <text x="624" y="180" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Train one building</text>
      <text x="624" y="204" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">box-aware gsplat</text>
      <rect x="768" y="136" width="208" height="96" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="872" y="180" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A 2.9 MB splat</text>
      <text x="872" y="204" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">12,375 gaussians</text>
      <line x1="24" y1="288" x2="976" y2="288" stroke="rgba(214,214,214,0.12)" stroke-width="1"/>
      <rect x="24" y="316" width="16" height="12" rx="2" fill="rgba(91,135,199,0.15)" stroke="#5b87c7" stroke-width="1.5"/>
      <text x="52" y="326" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">Where the box-aware work is</text>
      <rect x="270" y="316" width="16" height="12" rx="2" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="298" y="326" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">Stage</text>
      <line x1="371" y1="322" x2="403" y2="322" stroke="#7e7e7e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="419" y="326" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">Experimental shortcut</text>
    </svg>
  </div>
</body>
</html>
