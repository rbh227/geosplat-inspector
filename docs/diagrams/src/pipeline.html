<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplatAgent · Reconstruction pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #faf9f7;
      --color-ink:    #1e1e1e;
      --color-muted:  #5d5d5d;
      --color-accent: #5b87c7;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · SplatAgent</p>
    <h1>Drone video to a 2.9 MB building splat</h1>

    <svg viewBox="0 0 1000 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5d5d5d"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b87c7"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf9f7"/>

      <!-- Arrows first (behind boxes) -->
      <line x1="248" y1="168" x2="288" y2="168" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="168" x2="520" y2="168" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="712" y1="168" x2="752" y2="168" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Wrap: end of row 1 → start of row 2 -->
      <path d="M 848,200 V 256 Q 848,264 840,264 H 160 Q 152,264 152,272 V 328"
            fill="none" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Experimental bypass: skip COLMAP with VGGT -->
      <path d="M 384,136 V 104 Q 384,96 392,96 H 840 Q 848,96 848,104 V 136"
            fill="none" stroke="#5d5d5d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <line x1="248" y1="360" x2="288" y2="360" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="360" x2="520" y2="360" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="712" y1="360" x2="752" y2="360" stroke="#5b87c7" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <rect x="536" y="76" width="152" height="12" rx="2" fill="#faf9f7"/>
      <text x="612" y="85" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VGGT-1B · ONE 3.5 S PASS</text>

      <rect x="464" y="244" width="72" height="12" rx="2" fill="#faf9f7"/>
      <text x="500" y="253" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PER TARGET</text>

      <!-- Row 1 -->
      <!-- Node: Drone video -->
      <rect x="56" y="136" width="192" height="64" rx="6" fill="#faf9f7"/>
      <rect x="56" y="136" width="192" height="64" rx="6" fill="rgba(93,93,93,0.10)" stroke="#7e7e7e" stroke-width="1"/>
      <rect x="64" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(126,126,126,0.40)" stroke-width="0.8"/>
      <text x="78" y="153" fill="#7e7e7e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
      <text x="152" y="172" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Drone video</text>
      <text x="152" y="188" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3,525 4k frames · no gps</text>

      <!-- Node: Thin -->
      <rect x="288" y="136" width="192" height="64" rx="6" fill="#faf9f7"/>
      <rect x="288" y="136" width="192" height="64" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <rect x="296" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,30,30,0.40)" stroke-width="0.8"/>
      <text x="310" y="153" fill="#1e1e1e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
      <text x="384" y="172" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thin by sharpness</text>
      <text x="384" y="188" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">705 frames kept</text>

      <!-- Node: COLMAP -->
      <rect x="520" y="136" width="192" height="64" rx="6" fill="#faf9f7"/>
      <rect x="520" y="136" width="192" height="64" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <rect x="528" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,30,30,0.40)" stroke-width="0.8"/>
      <text x="542" y="153" fill="#1e1e1e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
      <text x="616" y="172" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">COLMAP SfM</text>
      <text x="616" y="188" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">705 poses · 604k points</text>

      <!-- Node: Pick target -->
      <rect x="752" y="136" width="192" height="64" rx="6" fill="#faf9f7"/>
      <rect x="752" y="136" width="192" height="64" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <rect x="760" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,30,30,0.40)" stroke-width="0.8"/>
      <text x="774" y="153" fill="#1e1e1e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
      <text x="848" y="172" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pick one building</text>
      <text x="848" y="188" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">crops + 3d box</text>

      <!-- Row 2 -->
      <!-- Node: Train (focal) -->
      <rect x="56" y="328" width="192" height="64" rx="6" fill="#faf9f7"/>
      <rect x="56" y="328" width="192" height="64" rx="6" fill="rgba(91,135,199,0.10)" stroke="#5b87c7" stroke-width="1"/>
      <rect x="64" y="336" width="28" height="12" rx="2" fill="transparent" stroke="rgba(91,135,199,0.50)" stroke-width="0.8"/>
      <text x="78" y="345" fill="#5b87c7" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
      <text x="152" y="364" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Train with gsplat</text>
      <text x="152" y="380" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">box-aware mcmc</text>

      <!-- Node: Prune -->
      <rect x="288" y="328" width="192" height="64" rx="6" fill="#faf9f7"/>
      <rect x="288" y="328" width="192" height="64" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <rect x="296" y="336" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,30,30,0.40)" stroke-width="0.8"/>
      <text x="310" y="345" fill="#1e1e1e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">05</text>
      <text x="384" y="364" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Prune artifacts</text>
      <text x="384" y="380" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">needles · floaters</text>

      <!-- Node: Package -->
      <rect x="520" y="328" width="192" height="64" rx="6" fill="#faf9f7"/>
      <rect x="520" y="328" width="192" height="64" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <rect x="528" y="336" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,30,30,0.40)" stroke-width="0.8"/>
      <text x="542" y="345" fill="#1e1e1e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">06</text>
      <text x="616" y="364" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verify + package</text>
      <text x="616" y="380" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">psnr on held-out views</text>

      <!-- Node: SplatAgent -->
      <rect x="752" y="328" width="192" height="64" rx="6" fill="#faf9f7"/>
      <rect x="752" y="328" width="192" height="64" rx="6" fill="rgba(30,30,30,0.05)" stroke="#5d5d5d" stroke-width="1"/>
      <rect x="760" y="336" width="32" height="12" rx="2" fill="transparent" stroke="rgba(93,93,93,0.50)" stroke-width="0.8"/>
      <text x="776" y="345" fill="#5d5d5d" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="848" y="364" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SplatAgent scene</text>
      <text x="848" y="380" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">12,375 splats · 2.9 mb</text>

      <!-- Legend -->
      <line x1="40" y1="440" x2="960" y2="440" stroke="rgba(30,30,30,0.10)" stroke-width="0.8"/>
      <text x="40" y="456" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="472" width="14" height="10" rx="2" fill="rgba(91,135,199,0.10)" stroke="#5b87c7" stroke-width="1"/>
      <text x="60" y="480" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Focal · where the box-aware work lives</text>

      <rect x="336" y="472" width="14" height="10" rx="2" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <text x="356" y="480" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Pipeline stage</text>

      <rect x="480" y="472" width="14" height="10" rx="2" fill="rgba(93,93,93,0.10)" stroke="#7e7e7e" stroke-width="1"/>
      <text x="500" y="480" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Raw input</text>

      <line x1="608" y1="478" x2="636" y2="478" stroke="#5d5d5d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="644" y="480" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Experimental bypass</text>

      <line x1="816" y1="478" x2="844" y2="478" stroke="#5b87c7" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="852" y="480" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Deliverable</text>
    </svg>
  </div>
</body>
</html>
