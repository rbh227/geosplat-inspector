<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplatAgent · Three gestures, one selection</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #151515; --panel: #1e1e1e; --ink: #d6d6d6;
      --muted: #a9a9a9; --dim: #7e7e7e; --accent: #5b87c7;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.6rem, 2.4vw + 0.8rem, 2.2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.75rem;
    }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Selection</p>
    <h1>Three gestures, one selection</h1>

    <svg viewBox="0 0 960 552" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7e7e7e"/></marker>
        <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#5b87c7"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#151515"/>

      <path d="M 248,120 H 320 Q 328,120 328,128 V 192 Q 328,200 336,200 H 392" fill="none" stroke="#7e7e7e" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="248" y1="232" x2="392" y2="232" stroke="#7e7e7e" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M 248,344 H 320 Q 328,344 328,336 V 272 Q 328,264 336,264 H 392" fill="none" stroke="#7e7e7e" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="632" y1="232" x2="712" y2="232" stroke="#5b87c7" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <rect x="48" y="88" width="200" height="64" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="148" y="116" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Brush</text>
      <text x="148" y="140" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">paint it</text>
      <rect x="48" y="200" width="200" height="64" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="148" y="228" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lasso</text>
      <text x="148" y="252" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">draw around it</text>
      <rect x="48" y="312" width="200" height="64" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="148" y="340" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Polygon</text>
      <text x="148" y="364" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">click the corners</text>
      <rect x="392" y="184" width="240" height="96" rx="4" fill="rgba(91,135,199,0.15)" stroke="#5b87c7" stroke-width="1.5"/>
      <text x="512" y="228" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Selection set</text>
      <text x="512" y="252" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">stable splat ids</text>
      <rect x="712" y="184" width="200" height="96" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="812" y="228" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Delete · keep</text>
      <text x="812" y="252" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">or invert it</text>
      <text x="48" y="424" fill="#7e7e7e" font-size="17" font-style="italic" font-family="'Instrument Serif', serif">Alt subtracts. Escape cancels. The agent uses the same three.</text>
      <line x1="48" y1="456" x2="912" y2="456" stroke="rgba(214,214,214,0.12)" stroke-width="1"/>
      <rect x="48" y="484" width="16" height="12" rx="2" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="76" y="494" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">Pointer gesture</text>
      <rect x="215" y="484" width="16" height="12" rx="2" fill="rgba(91,135,199,0.15)" stroke="#5b87c7" stroke-width="1.5"/>
      <text x="243" y="494" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">One shared selection</text>
    </svg>
  </div>
</body>
</html>
