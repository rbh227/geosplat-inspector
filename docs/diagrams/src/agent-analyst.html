<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplatAgent · The Analyst</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #faf9f7;
      --color-ink:    #1e1e1e;
      --color-muted:  #5d5d5d;
      --color-accent: #5b87c7;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Understand stage</p>
    <h1>The app flies the survey — the model only looks</h1>

    <svg viewBox="0 0 1000 656" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5d5d5d"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b87c7"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf9f7"/>

      <!-- Lifelines -->
      <line x1="112" y1="128" x2="112" y2="528" stroke="rgba(30,30,30,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="368" y1="128" x2="368" y2="528" stroke="rgba(30,30,30,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="624" y1="128" x2="624" y2="528" stroke="rgba(30,30,30,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="880" y1="128" x2="880" y2="528" stroke="rgba(30,30,30,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="364" y="176" width="8" height="304" fill="rgba(30,30,30,0.06)" stroke="#5d5d5d" stroke-width="0.8"/>
      <rect x="620" y="280" width="8" height="40" fill="rgba(30,30,30,0.06)" stroke="#5d5d5d" stroke-width="0.8"/>
      <rect x="876" y="400" width="8" height="40" fill="rgba(30,30,30,0.06)" stroke="#5d5d5d" stroke-width="0.8"/>

      <!-- LOOP fragment -->
      <rect x="336" y="216" width="344" height="136" rx="4" fill="rgba(30,30,30,0.02)" stroke="rgba(30,30,30,0.22)" stroke-width="1"/>
      <rect x="336" y="216" width="48" height="16" rx="2" fill="#faf9f7" stroke="rgba(30,30,30,0.22)" stroke-width="1"/>
      <text x="360" y="228" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="392" y="252" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[each pose on the framed orbit]</text>

      <!-- Messages -->
      <line x1="112" y1="176" x2="360" y2="176" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="372" y1="280" x2="616" y2="280" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="616" y1="320" x2="376" y2="320" stroke="#5d5d5d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="372" y1="400" x2="872" y2="400" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="872" y1="440" x2="376" y2="440" stroke="#5b87c7" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <line x1="360" y1="480" x2="120" y2="480" stroke="#5d5d5d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Message labels -->
      <rect x="160" y="156" width="152" height="12" rx="2" fill="#faf9f7"/>
      <text x="236" y="165" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOW MANY TRAILERS?</text>

      <rect x="416" y="260" width="156" height="12" rx="2" fill="#faf9f7"/>
      <text x="494" y="269" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MOVE CAMERA · CAPTURE</text>

      <rect x="440" y="300" width="108" height="12" rx="2" fill="#faf9f7"/>
      <text x="494" y="309" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FRAME · PNG</text>

      <rect x="464" y="380" width="152" height="12" rx="2" fill="#faf9f7"/>
      <text x="540" y="389" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUESTION + FRAMES</text>

      <rect x="644" y="420" width="152" height="12" rx="2" fill="#faf9f7"/>
      <text x="720" y="429" fill="#5b87c7" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COUNT · WHAT IT SAW</text>

      <rect x="164" y="460" width="152" height="12" rx="2" fill="#faf9f7"/>
      <text x="240" y="469" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANSWER + THE VIEWS</text>

      <!-- Actors -->
      <rect x="24" y="64" width="176" height="64" rx="6" fill="#faf9f7"/>
      <rect x="24" y="64" width="176" height="64" rx="6" fill="rgba(93,93,93,0.10)" stroke="#7e7e7e" stroke-width="1"/>
      <rect x="32" y="72" width="40" height="12" rx="2" fill="transparent" stroke="rgba(126,126,126,0.40)" stroke-width="0.8"/>
      <text x="52" y="81" fill="#7e7e7e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HUMAN</text>
      <text x="112" y="100" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">You</text>
      <text x="112" y="116" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chat panel</text>

      <rect x="280" y="64" width="176" height="64" rx="6" fill="#faf9f7"/>
      <rect x="280" y="64" width="176" height="64" rx="6" fill="rgba(91,135,199,0.10)" stroke="#5b87c7" stroke-width="1"/>
      <rect x="288" y="72" width="44" height="12" rx="2" fill="transparent" stroke="rgba(91,135,199,0.50)" stroke-width="0.8"/>
      <text x="310" y="81" fill="#5b87c7" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DRIVER</text>
      <text x="368" y="100" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">App survey</text>
      <text x="368" y="116" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">poses from your view</text>

      <rect x="536" y="64" width="176" height="64" rx="6" fill="#faf9f7"/>
      <rect x="536" y="64" width="176" height="64" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <rect x="544" y="72" width="36" height="12" rx="2" fill="transparent" stroke="rgba(30,30,30,0.40)" stroke-width="0.8"/>
      <text x="562" y="81" fill="#1e1e1e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIEW</text>
      <text x="624" y="100" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Renderer</text>
      <text x="624" y="116" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sparkjs canvas</text>

      <rect x="792" y="64" width="176" height="64" rx="6" fill="#faf9f7"/>
      <rect x="792" y="64" width="176" height="64" rx="6" fill="rgba(30,30,30,0.03)" stroke="rgba(30,30,30,0.30)" stroke-width="1"/>
      <rect x="800" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,30,30,0.22)" stroke-width="0.8"/>
      <text x="814" y="81" fill="#7e7e7e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VLM</text>
      <text x="880" y="100" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vision model</text>
      <text x="880" y="116" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">look-only tools</text>

      <!-- Editorial callout -->
      <text x="960" y="556" fill="#1e1e1e" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">In this stage the edit tools are not in the model's spec at all — it could not cut a splat if it tried</text>
      <path d="M 828 540 Q 856 528 876 504" fill="none" stroke="rgba(30,30,30,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="880" cy="500" r="2" fill="#1e1e1e"/>

      <!-- Legend -->
      <line x1="40" y1="584" x2="960" y2="584" stroke="rgba(30,30,30,0.10)" stroke-width="0.8"/>
      <text x="40" y="600" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="616" width="14" height="10" rx="2" fill="rgba(93,93,93,0.10)" stroke="#7e7e7e" stroke-width="1"/>
      <text x="60" y="624" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Actor</text>

      <rect x="128" y="616" width="14" height="10" rx="2" fill="rgba(91,135,199,0.10)" stroke="#5b87c7" stroke-width="1"/>
      <text x="148" y="624" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Focal · the app owns the camera</text>

      <rect x="380" y="616" width="14" height="10" rx="2" fill="rgba(30,30,30,0.03)" stroke="rgba(30,30,30,0.30)" stroke-width="1"/>
      <text x="400" y="624" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">External model</text>

      <line x1="536" y1="622" x2="564" y2="622" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="572" y="624" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Call</text>

      <line x1="648" y1="622" x2="676" y2="622" stroke="#5d5d5d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="684" y="624" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

      <line x1="776" y1="622" x2="804" y2="622" stroke="#5b87c7" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="812" y="624" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Grounded answer</text>
    </svg>
  </div>
</body>
</html>
