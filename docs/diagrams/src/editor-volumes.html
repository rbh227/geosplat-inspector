<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplatAgent · Volumes preview before they commit</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #151515; --panel: #1e1e1e; --ink: #d6d6d6;
      --muted: #a9a9a9; --dim: #7e7e7e; --accent: #5b87c7;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.6rem, 2.4vw + 0.8rem, 2.2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.75rem;
    }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Selection</p>
    <h1>Volumes preview before they commit</h1>

    <svg viewBox="0 0 960 552" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7e7e7e"/></marker>
        <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#5b87c7"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#151515"/>

      <line x1="288" y1="168" x2="360" y2="168" stroke="#7e7e7e" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="600" y1="168" x2="672" y2="168" stroke="#5b87c7" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <path d="M 480,216 V 288 Q 480,296 472,296 H 176 Q 168,296 168,288 V 216" fill="none" stroke="#7e7e7e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="300" y="136" width="48" height="16" rx="2" fill="#151515"/>
      <text x="324" y="148" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">SDF</text>
      <rect x="604" y="136" width="64" height="16" rx="2" fill="#151515"/>
      <text x="636" y="148" fill="#5b87c7" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">COMMIT</text>
      <rect x="172" y="304" width="304" height="16" rx="2" fill="#151515"/>
      <text x="324" y="316" fill="#7e7e7e" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">DRAG TO ADJUST — THE PREVIEW FOLLOWS</text>
      <rect x="48" y="120" width="240" height="96" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="168" y="164" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Place a sphere or box</text>
      <text x="168" y="188" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">in the 3d scene</text>
      <rect x="360" y="120" width="240" height="96" rx="4" fill="rgba(91,135,199,0.15)" stroke="#5b87c7" stroke-width="1.5"/>
      <text x="480" y="164" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Everything outside dims</text>
      <text x="480" y="188" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">nothing deleted yet</text>
      <rect x="672" y="120" width="240" height="96" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="792" y="164" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Keep it or cut it</text>
      <text x="792" y="188" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">one edit, undoable</text>
      <text x="48" y="384" fill="#5b87c7" font-size="17" font-style="italic" font-family="'Instrument Serif', serif">The agent places the same volumes — you watch its</text>
      <text x="48" y="408" fill="#5b87c7" font-size="17" font-style="italic" font-family="'Instrument Serif', serif">selection dim before a single splat is cut.</text>
      <line x1="48" y1="456" x2="912" y2="456" stroke="rgba(214,214,214,0.12)" stroke-width="1"/>
      <rect x="48" y="484" width="16" height="12" rx="2" fill="rgba(91,135,199,0.15)" stroke="#5b87c7" stroke-width="1.5"/>
      <text x="76" y="494" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">Live preview · non-destructive</text>
      <rect x="314" y="484" width="16" height="12" rx="2" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="342" y="494" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">Step</text>
      <line x1="408" y1="490" x2="440" y2="490" stroke="#7e7e7e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="456" y="494" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">Adjust and re-preview</text>
    </svg>
  </div>
</body>
</html>
