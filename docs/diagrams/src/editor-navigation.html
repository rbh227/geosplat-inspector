<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplatAgent · One camera, three ways to drive it</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #151515; --panel: #1e1e1e; --ink: #d6d6d6;
      --muted: #a9a9a9; --dim: #7e7e7e; --accent: #5b87c7;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.6rem, 2.4vw + 0.8rem, 2.2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.75rem;
    }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Navigation</p>
    <h1>One camera, three ways to drive it</h1>

    <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7e7e7e"/></marker>
        <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#5b87c7"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#151515"/>

      <line x1="256" y1="144" x2="368" y2="144" stroke="#7e7e7e" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="368" y1="192" x2="256" y2="192" stroke="#7e7e7e" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="592" y1="144" x2="704" y2="144" stroke="#7e7e7e" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="704" y1="192" x2="592" y2="192" stroke="#5b87c7" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <rect x="280" y="120" width="64" height="16" rx="2" fill="#151515"/>
      <text x="312" y="132" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">TOGGLE</text>
      <rect x="280" y="200" width="64" height="16" rx="2" fill="#151515"/>
      <text x="312" y="212" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">TOGGLE</text>
      <rect x="604" y="120" width="88" height="16" rx="2" fill="#151515"/>
      <text x="648" y="132" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">AGENT RUN</text>
      <rect x="608" y="200" width="80" height="16" rx="2" fill="#151515"/>
      <text x="648" y="212" fill="#5b87c7" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">YOU MOVE</text>
      <rect x="32" y="120" width="224" height="96" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="144" y="164" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Orbit</text>
      <text x="144" y="188" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">drag to circle it</text>
      <rect x="368" y="120" width="224" height="96" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="480" y="164" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fly</text>
      <text x="480" y="188" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">wasd · qe · look</text>
      <rect x="704" y="120" width="224" height="96" rx="4" fill="rgba(91,135,199,0.15)" stroke="#5b87c7" stroke-width="1.5"/>
      <text x="816" y="164" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent-driven</text>
      <text x="816" y="188" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">move_camera</text>
      <text x="32" y="296" fill="#a9a9a9" font-size="17" font-style="italic" font-family="'Instrument Serif', serif">The movement pad lights up for any of the three —</text>
      <text x="32" y="320" fill="#a9a9a9" font-size="17" font-style="italic" font-family="'Instrument Serif', serif">that is how you watch the agent fly.</text>
      <line x1="32" y1="384" x2="928" y2="384" stroke="rgba(214,214,214,0.12)" stroke-width="1"/>
      <rect x="32" y="412" width="16" height="12" rx="2" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="60" y="422" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">You are driving</text>
      <rect x="199" y="412" width="16" height="12" rx="2" fill="rgba(91,135,199,0.15)" stroke="#5b87c7" stroke-width="1.5"/>
      <text x="227" y="422" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">The agent is driving</text>
      <line x1="399" y1="418" x2="431" y2="418" stroke="#5b87c7" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <text x="447" y="422" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">Touching the camera pauses the run</text>
    </svg>
  </div>
</body>
</html>
