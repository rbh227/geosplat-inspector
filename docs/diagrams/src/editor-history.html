<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplatAgent · Your edits and the agent's are the same edits</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #151515; --panel: #1e1e1e; --ink: #d6d6d6;
      --muted: #a9a9a9; --dim: #7e7e7e; --accent: #5b87c7;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.6rem, 2.4vw + 0.8rem, 2.2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.75rem;
    }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Edit history</p>
    <h1>Your edits and the agent's are the same edits</h1>

    <svg viewBox="0 0 1000 624" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7e7e7e"/></marker>
        <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#5b87c7"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#151515"/>

      <line x1="140" y1="128" x2="140" y2="456" stroke="rgba(214,214,214,0.18)" stroke-width="1.5" stroke-dasharray="4,4"/>
      <line x1="380" y1="128" x2="380" y2="456" stroke="rgba(214,214,214,0.18)" stroke-width="1.5" stroke-dasharray="4,4"/>
      <line x1="620" y1="128" x2="620" y2="456" stroke="rgba(214,214,214,0.18)" stroke-width="1.5" stroke-dasharray="4,4"/>
      <line x1="860" y1="128" x2="860" y2="456" stroke="rgba(214,214,214,0.18)" stroke-width="1.5" stroke-dasharray="4,4"/>
      <rect x="612" y="192" width="16" height="168" fill="rgba(214,214,214,0.06)" stroke="#5d5d5d" stroke-width="1"/>
      <line x1="140" y1="200" x2="604" y2="200" stroke="#7e7e7e" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="380" y1="272" x2="604" y2="272" stroke="#7e7e7e" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="636" y1="344" x2="844" y2="344" stroke="#5b87c7" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <line x1="844" y1="416" x2="156" y2="416" stroke="#7e7e7e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="178" y="176" width="184" height="16" rx="2" fill="#151515"/>
      <text x="270" y="188" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">DELETE THIS SELECTION</text>
      <rect x="412" y="248" width="160" height="16" rx="2" fill="#151515"/>
      <text x="492" y="260" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">APPROVED KEEP-ONLY</text>
      <rect x="648" y="320" width="184" height="16" rx="2" fill="#151515"/>
      <text x="740" y="332" fill="#5b87c7" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">ONE ENTRY, EITHER WAY</text>
      <rect x="416" y="392" width="168" height="16" rx="2" fill="#151515"/>
      <text x="500" y="404" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">UNDO WORKS FOR BOTH</text>
      <rect x="40" y="48" width="200" height="80" rx="4" fill="#272727" stroke="#2d2d2d" stroke-width="1.5"/>
      <text x="140" y="84" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">You</text>
      <text x="140" y="108" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">the tool rail</text>
      <rect x="280" y="48" width="200" height="80" rx="4" fill="#272727" stroke="#2d2d2d" stroke-width="1.5"/>
      <text x="380" y="84" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent</text>
      <text x="380" y="108" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">after approval</text>
      <rect x="520" y="48" width="200" height="80" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="620" y="84" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/edit</text>
      <text x="620" y="108" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">one endpoint</text>
      <rect x="760" y="48" width="200" height="80" rx="4" fill="rgba(91,135,199,0.15)" stroke="#5b87c7" stroke-width="1.5"/>
      <text x="860" y="84" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">History</text>
      <text x="860" y="108" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">the only truth</text>
      <text x="40" y="504" fill="#a9a9a9" font-size="17" font-style="italic" font-family="'Instrument Serif', serif">Same endpoint, same history, same undo stack.</text>
      <line x1="40" y1="536" x2="960" y2="536" stroke="rgba(214,214,214,0.12)" stroke-width="1"/>
      <rect x="40" y="564" width="16" height="12" rx="2" fill="rgba(91,135,199,0.15)" stroke="#5b87c7" stroke-width="1.5"/>
      <text x="68" y="574" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">One source of truth</text>
      <line x1="233" y1="570" x2="265" y2="570" stroke="#5b87c7" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <text x="281" y="574" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">Every edit lands here</text>
      <line x1="459" y1="570" x2="491" y2="570" stroke="#7e7e7e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="507" y="574" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">Reply</text>
    </svg>
  </div>
</body>
</html>
