<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplatAgent · Shared edit history</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #faf9f7;
      --color-ink:    #1e1e1e;
      --color-muted:  #5d5d5d;
      --color-accent: #5b87c7;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · SplatAgent editor</p>
    <h1>Your edits and the agent's land in the same history</h1>

    <svg viewBox="0 0 1000 696" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5d5d5d"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b87c7"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf9f7"/>

      <!-- Lifelines -->
      <line x1="112" y1="128" x2="112" y2="600" stroke="rgba(30,30,30,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="312" y1="128" x2="312" y2="600" stroke="rgba(30,30,30,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="512" y1="128" x2="512" y2="600" stroke="rgba(30,30,30,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="712" y1="128" x2="712" y2="600" stroke="rgba(30,30,30,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="896" y1="128" x2="896" y2="600" stroke="rgba(30,30,30,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="708" y="216" width="8" height="112" fill="rgba(30,30,30,0.06)" stroke="#5d5d5d" stroke-width="0.8"/>
      <rect x="708" y="376" width="8" height="80" fill="rgba(30,30,30,0.06)" stroke="#5d5d5d" stroke-width="0.8"/>
      <rect x="892" y="256" width="8" height="36" fill="rgba(30,30,30,0.06)" stroke="#5d5d5d" stroke-width="0.8"/>
      <rect x="892" y="416" width="8" height="24" fill="rgba(30,30,30,0.06)" stroke="#5d5d5d" stroke-width="0.8"/>

      <!-- OPT fragment (failure path) -->

      <rect x="480" y="488" width="40" height="16" rx="2" fill="#faf9f7" stroke="rgba(30,30,30,0.22)" stroke-width="1"/>
      <text x="500" y="500" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
      <text x="528" y="524" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[backend rejects the edit]</text>

      <!-- Messages -->
      <line x1="112" y1="176" x2="504" y2="176" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="512" y1="216" x2="704" y2="216" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="716" y1="256" x2="888" y2="256" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="888" y1="292" x2="720" y2="292" stroke="#5d5d5d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="704" y1="328" x2="520" y2="328" stroke="#5b87c7" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

      <line x1="312" y1="376" x2="704" y2="376" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="716" y1="416" x2="888" y2="416" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="704" y1="456" x2="520" y2="456" stroke="#5d5d5d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <line x1="704" y1="552" x2="520" y2="552" stroke="#5d5d5d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Message labels -->
      <rect x="220" y="156" width="184" height="12" rx="2" fill="#faf9f7"/>
      <text x="312" y="165" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BRUSH · LASSO · DELETE</text>

      <rect x="524" y="196" width="176" height="12" rx="2" fill="#faf9f7"/>
      <text x="612" y="205" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /EDIT DELETE_BY_IDS</text>

      <rect x="748" y="236" width="112" height="12" rx="2" fill="#faf9f7"/>
      <text x="804" y="245" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUSH ENTRY</text>

      <rect x="744" y="272" width="120" height="12" rx="2" fill="#faf9f7"/>
      <text x="804" y="281" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEW ALIVE MASK</text>

      <rect x="548" y="308" width="128" height="12" rx="2" fill="#faf9f7"/>
      <text x="612" y="317" fill="#5b87c7" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OK · KEPT IDS</text>

      <rect x="352" y="356" width="176" height="12" rx="2" fill="#faf9f7"/>
      <text x="440" y="365" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPROVED KEEP_ONLY_IDS</text>

      <rect x="748" y="396" width="112" height="12" rx="2" fill="#faf9f7"/>
      <text x="804" y="405" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUSH ENTRY</text>

      <rect x="536" y="436" width="152" height="12" rx="2" fill="#faf9f7"/>
      <text x="612" y="445" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAME UNDO STACK</text>

      <rect x="536" y="532" width="152" height="12" rx="2" fill="#faf9f7"/>
      <text x="612" y="541" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RELOAD · ADOPT /IDS</text>

      <!-- Actors -->
      <rect x="32" y="64" width="160" height="64" rx="6" fill="#faf9f7"/>
      <rect x="32" y="64" width="160" height="64" rx="6" fill="rgba(93,93,93,0.10)" stroke="#7e7e7e" stroke-width="1"/>
      <rect x="40" y="72" width="40" height="12" rx="2" fill="transparent" stroke="rgba(126,126,126,0.40)" stroke-width="0.8"/>
      <text x="60" y="81" fill="#7e7e7e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HUMAN</text>
      <text x="112" y="100" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">You</text>
      <text x="112" y="116" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tool rail</text>

      <rect x="232" y="64" width="160" height="64" rx="6" fill="#faf9f7"/>
      <rect x="232" y="64" width="160" height="64" rx="6" fill="rgba(93,93,93,0.10)" stroke="#7e7e7e" stroke-width="1"/>
      <rect x="240" y="72" width="40" height="12" rx="2" fill="transparent" stroke="rgba(126,126,126,0.40)" stroke-width="0.8"/>
      <text x="260" y="81" fill="#7e7e7e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="312" y="100" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent</text>
      <text x="312" y="116" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">after approval</text>

      <rect x="432" y="64" width="160" height="64" rx="6" fill="#faf9f7"/>
      <rect x="432" y="64" width="160" height="64" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <rect x="440" y="72" width="36" height="12" rx="2" fill="transparent" stroke="rgba(30,30,30,0.40)" stroke-width="0.8"/>
      <text x="458" y="81" fill="#1e1e1e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIEW</text>
      <text x="512" y="100" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Viewer</text>
      <text x="512" y="116" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">local mirror</text>

      <rect x="632" y="64" width="160" height="64" rx="6" fill="#faf9f7"/>
      <rect x="632" y="64" width="160" height="64" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <rect x="640" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(30,30,30,0.40)" stroke-width="0.8"/>
      <text x="654" y="81" fill="#1e1e1e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="712" y="100" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/edit</text>
      <text x="712" y="116" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fastapi</text>

      <rect x="816" y="64" width="160" height="64" rx="6" fill="#faf9f7"/>
      <rect x="816" y="64" width="160" height="64" rx="6" fill="rgba(91,135,199,0.10)" stroke="#5b87c7" stroke-width="1"/>
      <rect x="824" y="72" width="40" height="12" rx="2" fill="transparent" stroke="rgba(91,135,199,0.50)" stroke-width="0.8"/>
      <text x="844" y="81" fill="#5b87c7" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRUTH</text>
      <text x="896" y="100" fill="#1e1e1e" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">History</text>
      <text x="896" y="116" fill="#5d5d5d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stable splat ids</text>

      <!-- Legend -->
      <line x1="40" y1="624" x2="960" y2="624" stroke="rgba(30,30,30,0.10)" stroke-width="0.8"/>
      <text x="40" y="640" fill="#5d5d5d" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="656" width="14" height="10" rx="2" fill="rgba(93,93,93,0.10)" stroke="#7e7e7e" stroke-width="1"/>
      <text x="60" y="664" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Actor</text>

      <rect x="128" y="656" width="14" height="10" rx="2" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/>
      <text x="148" y="664" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Service</text>

      <rect x="232" y="656" width="14" height="10" rx="2" fill="rgba(91,135,199,0.10)" stroke="#5b87c7" stroke-width="1"/>
      <text x="252" y="664" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Focal · the one source of truth</text>

      <line x1="468" y1="662" x2="496" y2="662" stroke="#5d5d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="504" y="664" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Call</text>

      <line x1="580" y1="662" x2="608" y2="662" stroke="#5d5d5d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="616" y="664" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

      <line x1="708" y1="662" x2="736" y2="662" stroke="#5b87c7" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="744" y="664" fill="#5d5d5d" font-size="8.5" font-family="'Geist', sans-serif">Happy path · instant undo</text>
    </svg>
  </div>
</body>
</html>
