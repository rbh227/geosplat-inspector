<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplatAgent · System overview</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #151515; --panel: #1e1e1e; --ink: #d6d6d6;
      --muted: #a9a9a9; --dim: #7e7e7e; --accent: #5b87c7;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.6rem, 2.4vw + 0.8rem, 2.2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.75rem;
    }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture</p>
    <h1>The browser is the agent's eyes</h1>

    <svg viewBox="0 0 960 496" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7e7e7e"/></marker>
        <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#5b87c7"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#151515"/>

      <!-- Arrows -->
      <line x1="288" y1="144" x2="360" y2="144" stroke="#5b87c7" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <line x1="360" y1="184" x2="288" y2="184" stroke="#7e7e7e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="600" y1="144" x2="672" y2="144" stroke="#7e7e7e" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="672" y1="184" x2="600" y2="184" stroke="#7e7e7e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="480" y1="208" x2="480" y2="288" stroke="#7e7e7e" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="292" y="120" width="64" height="16" rx="2" fill="#151515"/>
      <text x="324" y="132" fill="#5b87c7" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">FRAMES</text>

      <rect x="292" y="192" width="64" height="16" rx="2" fill="#151515"/>
      <text x="324" y="204" fill="#7e7e7e" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">TOOLS</text>

      <rect x="604" y="120" width="64" height="16" rx="2" fill="#151515"/>
      <text x="636" y="132" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">ASK</text>

      <rect x="604" y="192" width="64" height="16" rx="2" fill="#151515"/>
      <text x="636" y="204" fill="#7e7e7e" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">REPLY</text>

      <rect x="488" y="240" width="72" height="16" rx="2" fill="#151515"/>
      <text x="496" y="252" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace">EDITS</text>

      <!-- Node: Browser -->
      <rect x="48" y="112" width="240" height="96" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="168" y="156" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>
      <text x="168" y="180" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">renders · captures frames</text>

      <!-- Node: Backend (focal) -->
      <rect x="360" y="112" width="240" height="96" rx="4" fill="rgba(91,135,199,0.15)" stroke="#5b87c7" stroke-width="1.5"/>
      <text x="480" y="156" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Python backend</text>
      <text x="480" y="180" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">agent loop · no cuda</text>

      <!-- Node: Model -->
      <rect x="672" y="112" width="240" height="96" rx="4" fill="#272727" stroke="#2d2d2d" stroke-width="1.5"/>
      <text x="792" y="156" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vision model</text>
      <text x="792" y="180" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">gemini · local vllm</text>

      <!-- Node: Splat data -->
      <rect x="360" y="288" width="240" height="96" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="480" y="332" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Splat data</text>
      <text x="480" y="356" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">stable ids · history</text>

      <!-- Legend -->
      <line x1="48" y1="424" x2="912" y2="424" stroke="rgba(214,214,214,0.12)" stroke-width="1"/>
      <rect x="48" y="452" width="16" height="12" rx="2" fill="rgba(91,135,199,0.15)" stroke="#5b87c7" stroke-width="1.5"/>
      <text x="76" y="462" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">Where the agent runs</text>

      <line x1="288" y1="458" x2="320" y2="458" stroke="#5b87c7" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <text x="336" y="462" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">What the model sees — captured frames, never raw splats</text>
    </svg>
  </div>
</body>
</html>
