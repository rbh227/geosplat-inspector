<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplatAgent · Where was every photo taken from?</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #151515; --panel: #1e1e1e; --ink: #d6d6d6;
      --muted: #a9a9a9; --dim: #7e7e7e; --accent: #5b87c7;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.6rem, 2.4vw + 0.8rem, 2.2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.75rem;
    }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">COLMAP</p>
    <h1>Where was every photo taken from?</h1>

    <svg viewBox="0 0 960 592" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7e7e7e"/></marker>
        <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#5b87c7"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#151515"/>

      <path d="M 792,112 V 72 Q 792,64 784,64 H 488 Q 480,64 480,72 V 112" fill="none" stroke="#7e7e7e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="288" y1="160" x2="360" y2="160" stroke="#7e7e7e" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="600" y1="160" x2="672" y2="160" stroke="#7e7e7e" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M 792,208 V 328 Q 792,336 784,336 H 728" fill="none" stroke="#5b87c7" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <rect x="552" y="32" width="168" height="16" rx="2" fill="#151515"/>
      <text x="636" y="44" fill="#7e7e7e" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">THEN THE NEXT PHOTO</text>
      <rect x="48" y="112" width="240" height="96" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="168" y="156" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Find landmarks</text>
      <text x="168" y="180" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">corners, 40k a frame</text>
      <rect x="360" y="112" width="240" height="96" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="480" y="156" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Match across photos</text>
      <text x="480" y="180" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">same corner, new angle</text>
      <rect x="672" y="112" width="240" height="96" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="792" y="156" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Triangulate</text>
      <text x="792" y="180" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">two angles → a point</text>
      <rect x="240" y="288" width="480" height="96" rx="4" fill="rgba(91,135,199,0.15)" stroke="#5b87c7" stroke-width="1.5"/>
      <text x="480" y="332" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A pose for every photo, and a sparse cloud</text>
      <text x="480" y="356" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">705 / 705 frames · 604k points</text>
      <text x="48" y="432" fill="#a9a9a9" font-size="17" font-style="italic" font-family="'Instrument Serif', serif">Two angles on the same corner give depth — the way two eyes do.</text>
      <text x="48" y="456" fill="#a9a9a9" font-size="17" font-style="italic" font-family="'Instrument Serif', serif">If these poses are wrong, nothing downstream can fix it.</text>
      <line x1="48" y1="496" x2="912" y2="496" stroke="rgba(214,214,214,0.12)" stroke-width="1"/>
      <rect x="48" y="524" width="16" height="12" rx="2" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="76" y="534" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">Step</text>
      <rect x="142" y="524" width="16" height="12" rx="2" fill="rgba(91,135,199,0.15)" stroke="#5b87c7" stroke-width="1.5"/>
      <text x="170" y="534" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">What everything else is built on</text>
      <line x1="421" y1="530" x2="453" y2="530" stroke="#7e7e7e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="469" y="534" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">One photo at a time</text>
    </svg>
  </div>
</body>
</html>
