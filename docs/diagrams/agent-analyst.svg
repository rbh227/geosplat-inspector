<svg width="1000" height="672" viewBox="0 0 1000 672" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7e7e7e"/></marker>
        <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#5b87c7"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#151515"/>

      <line x1="140" y1="128" x2="140" y2="488" stroke="rgba(214,214,214,0.18)" stroke-width="1.5" stroke-dasharray="4,4"/>
      <line x1="500" y1="128" x2="500" y2="488" stroke="rgba(214,214,214,0.18)" stroke-width="1.5" stroke-dasharray="4,4"/>
      <line x1="860" y1="128" x2="860" y2="488" stroke="rgba(214,214,214,0.18)" stroke-width="1.5" stroke-dasharray="4,4"/>
      <line x1="140" y1="192" x2="484" y2="192" stroke="#7e7e7e" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="404" y="240" width="192" height="72" rx="4" fill="#1e1e1e" stroke="#383838" stroke-width="1.5"/>
      <text x="500" y="270" fill="#d6d6d6" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">the app flies</text>
      <text x="500" y="292" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">8 framed views</text>
      <line x1="500" y1="360" x2="844" y2="360" stroke="#7e7e7e" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="844" y1="416" x2="516" y2="416" stroke="#5b87c7" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <line x1="484" y1="472" x2="156" y2="472" stroke="#7e7e7e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="240" y="168" width="160" height="16" rx="2" fill="#151515"/>
      <text x="320" y="180" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">HOW MANY TRAILERS?</text>
      <rect x="568" y="336" width="208" height="16" rx="2" fill="#151515"/>
      <text x="672" y="348" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">THE VIEWS + THE QUESTION</text>
      <rect x="564" y="392" width="216" height="16" rx="2" fill="#151515"/>
      <text x="672" y="404" fill="#5b87c7" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">A COUNT, FROM THOSE VIEWS</text>
      <rect x="208" y="448" width="224" height="16" rx="2" fill="#151515"/>
      <text x="320" y="460" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">ANSWER + THE VIEWS IT USED</text>
      <rect x="40" y="48" width="200" height="80" rx="4" fill="#272727" stroke="#2d2d2d" stroke-width="1.5"/>
      <text x="140" y="84" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">You</text>
      <text x="140" y="108" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">the chat panel</text>
      <rect x="400" y="48" width="200" height="80" rx="4" fill="rgba(91,135,199,0.15)" stroke="#5b87c7" stroke-width="1.5"/>
      <text x="500" y="84" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">The app</text>
      <text x="500" y="108" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">holds the camera</text>
      <rect x="760" y="48" width="200" height="80" rx="4" fill="#272727" stroke="#2d2d2d" stroke-width="1.5"/>
      <text x="860" y="84" fill="#d6d6d6" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vision model</text>
      <text x="860" y="108" fill="#a9a9a9" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">look-only</text>
      <text x="40" y="536" fill="#a9a9a9" font-size="17" font-style="italic" font-family="'Instrument Serif', serif">The model never drives the camera, and it cannot edit —</text>
      <text x="40" y="560" fill="#a9a9a9" font-size="17" font-style="italic" font-family="'Instrument Serif', serif">the edit tools are not in its spec at all.</text>
      <line x1="40" y1="584" x2="960" y2="584" stroke="rgba(214,214,214,0.12)" stroke-width="1"/>
      <rect x="40" y="612" width="16" height="12" rx="2" fill="rgba(91,135,199,0.15)" stroke="#5b87c7" stroke-width="1.5"/>
      <text x="68" y="622" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">Drives the survey</text>
      <rect x="220" y="612" width="16" height="12" rx="2" fill="#272727" stroke="#2d2d2d" stroke-width="1.5"/>
      <text x="248" y="622" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">Only looks</text>
      <line x1="354" y1="618" x2="386" y2="618" stroke="#5b87c7" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <text x="402" y="622" fill="#a9a9a9" font-size="12" font-family="'Geist', sans-serif">Grounded answer</text>
    </svg>
